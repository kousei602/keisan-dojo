<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>計算道場</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for celebratory effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Home Screen -->
        <div id="view-home" class="view active">
            <header>
                <h1>計算道場</h1>
                <div class="profile">
                    <span class="profile-label">最高称号:</span>
                    <span id="highest-title" class="title-badge">見習い</span>
                </div>
            </header>
            <main>
                <div id="subject-list" class="subject-list">
                    <!-- Dynamically generated subjects and difficulty badges -->
                </div>
            </main>
        </div>

        <!-- Mode Select Modal -->
        <div id="modal-mode-select" class="modal hidden">
            <div class="modal-content">
                <h2 id="mode-select-title">段位選択</h2>
                <p class="mode-desc" id="mode-select-desc">推奨モードを選択してください</p>
                <div class="mode-buttons">
                    <button id="btn-mode-mental" class="btn primary">暗算モード<br><small>頭の中だけで計算</small></button>
                    <button id="btn-mode-written" class="btn secondary">手書きモード<br><small>紙とペンを用意</small></button>
                </div>
                <button id="btn-close-modal" class="btn outline mt-4">やめる</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="view-game" class="view hidden">
            <header class="game-header">
                <div id="game-progress">問題: 1 / 10</div>
                <button id="btn-quit-game" class="btn-text">やめる</button>
            </header>
            <main class="game-main">
                <div id="question-display" class="question">--</div>
                <div id="answer-display" class="answer-box"></div>
                
                <div class="keypad">
                    <button class="key num">7</button><button class="key num">8</button><button class="key num">9</button>
                    <button class="key num">4</button><button class="key num">5</button><button class="key num">6</button>
                    <button class="key num">1</button><button class="key num">2</button><button class="key num">3</button>
                    <button class="key action clear">C</button><button class="key num">0</button><button class="key num dot">.</button>
                    <button class="key num minus">-</button><button class="key action enter" style="grid-column: span 2;">決定</button>
                </div>
            </main>
        </div>

        <!-- Result Screen -->
        <div id="view-result" class="view hidden">
            <main class="result-main">
                <h1 id="result-title">結果発表</h1>
                <div id="result-score" class="score">8 / 10</div>
                <div id="result-message" class="message">クリア！</div>
                
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div id="result-progress-fill" class="progress-bar-fill"></div>
                    </div>
                    <div id="result-progress-text" class="progress-text">達成度: 10% (+10%)</div>
                </div>

                <div id="new-title-announcement" class="hidden title-announcement">
                    <h3>🎉 称号獲得 🎉</h3>
                    <div id="new-title-name" class="new-title-badge"></div>
                </div>

                <button id="btn-back-home" class="btn primary mt-8">道場へ戻る</button>
                
                <div class="ad-banner">
                    <small>広告スペース</small>
                </div>
            </main>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
